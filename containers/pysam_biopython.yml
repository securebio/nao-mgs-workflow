name: pysam_biopython
label: pysam_biopython
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::biopython=1.85
  - conda-forge::pandas=2.3.3
  # GHSA-6v7p-g79w-8964: msgpack OOB read on Unpacker reuse; fixed in 1.2.1
  - conda-forge::msgpack-python=1.2.1
  # CVE-2025-47273 (PackageIndex path traversal), plus CVE-2026-24049 / CVE-2026-23949 in
  # setuptools' vendored wheel and jaraco.context; 84.0.0 vendors wheel 0.46.3 and
  # jaraco.context 6.1.0, both fixed
  - conda-forge::setuptools=84.0.0
  - bioconda::pysam=0.23.3
