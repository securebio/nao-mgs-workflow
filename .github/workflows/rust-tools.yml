name: Rust Tools CI

# Images are built only on pushes to dev and published under a content-keyed
# `src-<key>` tag; `:dev` is then pointed at that image. Other floating tags are
# never built here: reset-branches.yml promotes the already-built image.
on:
  push:
    branches: [dev]
  pull_request:

permissions:
  id-token: write
  contents: read

# PR runs cancel superseded ones. Each dev push gets its own group so every
# commit's image is published; only the :dev retag (promote-dev) is serialized.
concurrency:
  group: ci-rust-tools-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build: ${{ steps.decide.outputs.build }}
      dockerfile-changed: ${{ steps.filter.outputs.dockerfile }}
      key: ${{ steps.image.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Rust changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust-tools/**'
              - 'docker/nao-rust-tools.Dockerfile'
              - '.github/workflows/rust-tools.yml'
            dockerfile:
              - 'docker/nao-rust-tools.Dockerfile'

      - name: Look up existing image
        if: github.event_name == 'push'
        id: image
        uses: ./.github/actions/rust-tools-image
        with:
          ref: ${{ github.sha }}

      # PRs build when Rust inputs changed; pushes build when no image exists for
      # this commit's build inputs, regardless of what the path filter says.
      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ "$EVENT" = "push" ]; then
            [ -z "$DIGEST" ] && BUILD=true || BUILD=false
          else
            BUILD=$RUST_CHANGED
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # --- Rust unit tests (runs on GitHub runner, not in Docker) ---
      - name: Install Rust toolchain
        if: steps.decide.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.decide.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-tools

      - name: Run Rust unit tests
        if: steps.decide.outputs.build == 'true'
        run: cargo test --workspace --release --manifest-path rust-tools/Cargo.toml

      # --- Container build (recompiles inside Docker for reproducibility) ---
      - name: Build container
        if: steps.decide.outputs.build == 'true'
        run: docker build --progress=plain -f docker/nao-rust-tools.Dockerfile -t nao-rust-tools:local .

      - name: Save container for downstream jobs
        if: steps.decide.outputs.build == 'true' && (github.event_name == 'push' || steps.filter.outputs.dockerfile == 'true')
        run: docker save nao-rust-tools:local | gzip > rust-tools.tar.gz

      - name: Upload container artifact
        if: steps.decide.outputs.build == 'true' && (github.event_name == 'push' || steps.filter.outputs.dockerfile == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: rust-container
          path: rust-tools.tar.gz
          retention-days: 1

  scan-vulnerabilities:
    needs: build-and-test
    # On PRs, only scan when the Dockerfile changes: Trivy sees only its Alpine packages, not Rust crates
    if: needs.build-and-test.outputs.build == 'true' && (github.event_name == 'push' || needs.build-and-test.outputs.dockerfile-changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-container

      - name: Load container
        run: gunzip -c rust-tools.tar.gz | docker load

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: 'nao-rust-tools:local'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  push-to-ecr:
    needs: [build-and-test, scan-vulnerabilities]
    if: github.event_name == 'push' && needs.build-and-test.outputs.build == 'true'
    # One publisher per key at a time, so the existence check below and the push
    # can't race another run's push of the same key
    concurrency:
      group: rust-tools-publish-${{ needs.build-and-test.outputs.key }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-container

      - name: Load container
        run: gunzip -c rust-tools.tar.gz | docker load

      # Re-check: another run may have published the same key meanwhile
      - name: Resolve image
        id: image
        uses: ./.github/actions/rust-tools-image
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        if: steps.image.outputs.digest == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RUST_TOOLS_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Push content-keyed image to ECR
        if: steps.image.outputs.digest == ''
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin public.ecr.aws
          docker tag nao-rust-tools:local "$IMAGE"
          docker push "$IMAGE"

  promote-dev:
    needs: [build-and-test, scan-vulnerabilities, push-to-ecr]
    # Runs on every dev push, including ones that built nothing (e.g. dev reset
    # to main); a failed scan or publish blocks it.
    if: >-
      always() && github.event_name == 'push' &&
      needs.build-and-test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.scan-vulnerabilities.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.push-to-ecr.result)
    # Serialized without dropping pending runs, and only the commit still at the
    # tip of dev retags, so an older run can't move :dev back.
    concurrency:
      group: rust-tools-promote-dev
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check this commit is still the tip of dev
        id: tip
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TIP=$(git ls-remote origin refs/heads/dev | cut -f1)
          [ -n "$TIP" ] || { echo "::error::Could not resolve refs/heads/dev"; exit 1; }
          [ "$TIP" = "$SHA" ] && IS_TIP=true || IS_TIP=false
          echo "dev is at $TIP; this run is $SHA"
          echo "is-tip=$IS_TIP" >> "$GITHUB_OUTPUT"

      - name: Point :dev at this commit's image
        if: steps.tip.outputs.is-tip == 'true'
        uses: ./.github/actions/promote-rust-tools
        with:
          ref: ${{ github.sha }}
          tag: dev
          role-to-assume: ${{ secrets.AWS_RUST_TOOLS_PUSH_ROLE_ARN }}
