name: Manually reset stable branch to main

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          Type "reset stable" to confirm. This will hard-reset
          the stable branch to match main.
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # AWS OIDC for promoting the rust-tools image tag

# Shared with reset-branches.yml, so overlapping resets can't pair stable
# with another release's image
concurrency:
  group: release-branch-reset
  cancel-in-progress: false
  queue: max

jobs:
  reset-stable:
    runs-on: ubuntu-latest
    environment: stable-reset

    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "reset stable" ]; then
            echo "::error::Confirmation failed. You must type 'reset stable' to proceed."
            exit 1
          fi

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show version info
        run: |
          set -euo pipefail
          read_version() {
            git show "$1:pyproject.toml" | python -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])"
          }
          MAIN_VERSION=$(read_version origin/main)
          STABLE_VERSION=$(read_version origin/stable)

          echo "Main version: $MAIN_VERSION"
          echo "Stable version: $STABLE_VERSION"
          echo ""
          echo "Stable will be updated from $STABLE_VERSION to $MAIN_VERSION"

          echo "### Stable branch reset" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous stable version:** $STABLE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **New stable version:** $MAIN_VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Capture main commit
        id: main
        run: echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      # Check before moving the branch, so a missing image aborts the reset
      - name: Resolve rust-tools image for main
        id: image
        uses: ./.github/actions/rust-tools-image
        with:
          ref: ${{ steps.main.outputs.sha }}

      - name: Check rust-tools image exists
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::No rust-tools image $IMAGE for main; not resetting stable."
            exit 1
          fi

      - name: Reset stable branch to main
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          git checkout stable
          git reset --hard "$MAIN_SHA"
          git push --force origin stable

          echo "Successfully reset stable to main"

      - name: Promote rust-tools image to :stable
        uses: ./.github/actions/promote-rust-tools
        with:
          ref: ${{ steps.main.outputs.sha }}
          tag: stable
          role-to-assume: ${{ secrets.AWS_RUST_TOOLS_PUSH_ROLE_ARN }}
