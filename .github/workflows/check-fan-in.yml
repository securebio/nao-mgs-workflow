name: Check fan-in annotations

on:
  pull_request: # Runs on all PRs

permissions:
  contents: read

jobs:
  check-fan-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every gathering channel operator is annotated
        run: python bin/check_fan_in.py
